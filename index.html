<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>进销存系统试用版</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect x='3' y='3' width='18' height='18' rx='4' fill='%230f766e'/%3E%3Cpath d='M7 16V9m5 7V7m5 9v-5' stroke='%23fff' stroke-width='2' stroke-linecap='round'/%3E%3C/svg%3E">
<style>:root{
  --brand:#0f766e;--brand2:#0d9488;--brand-soft:#ecfdf5;
  --bg:#f1f5f9;--ink:#0f172a;--ink2:#334155;--ink3:#64748b;--ink4:#94a3b8;
  --line:#e2e8f0;--line2:#eef2f7;
  --sh:0 1px 2px rgba(15,23,42,.05),0 4px 14px rgba(15,23,42,.04);
  --r-lg:16px;--r-md:13px;--r-sm:10px
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:linear-gradient(180deg,#f8fafc 0,#f1f5f9 42vh);color:#0f172a;font:14px/1.55 system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;max-width:560px;margin:0 auto;min-height:100vh;-webkit-tap-highlight-color:transparent}
#app{padding:14px 16px calc(116px + env(safe-area-inset-bottom))}
.view{display:none}
.view.active{display:block}
.topbar{position:sticky;top:0;z-index:25;display:flex;align-items:center;gap:8px;padding:9px 12px 12px;margin:0 -4px 6px;background:rgba(248,250,252,.88);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-radius:0 0 16px 16px}
.topbar .tt{font-size:19px;font-weight:800;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:.5px}
.topbar .sub{font-size:12.5px;color:#64748b;flex:1;text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.back{font-size:22px;color:#0f766e;cursor:pointer;line-height:1;padding:10px 12px 10px 4px;font-weight:700;margin-left:-6px;border-radius:10px}
.back:active{background:#ecfdf5}
.btn{display:block;background:linear-gradient(180deg,#0f766e,#0d9488);color:#fff;border:none;border-radius:13px;padding:13px 16px;font-size:15px;font-weight:600;width:100%;text-align:center;cursor:pointer;font-family:inherit;box-shadow:0 2px 6px rgba(15,118,110,.22),0 1px 2px rgba(15,23,42,.06);transition:transform .08s,box-shadow .18s}
.btn:active{opacity:.92;transform:scale(.985)}
.btn.gray{background:#f1f5f9;color:#334155;box-shadow:none}
.btn.red{background:#dc2626;box-shadow:0 2px 6px rgba(220,38,38,.2)}
.btn.ghost{background:#fff;border:1px solid #0f766e;color:#0f766e;box-shadow:none}
.btn.sm{display:inline-block;width:auto;padding:9px 13px;font-size:13px;border-radius:9px;box-shadow:none}
.btnrow{display:flex;gap:10px;margin-top:14px}
.btnrow .btn{flex:1}
.card{background:#fff;border:1px solid #eef2f7;border-radius:16px;padding:12px 14px;margin-bottom:10px;box-shadow:var(--sh)}
.card .ct{font-size:13.5px;font-weight:700;margin-bottom:9px;display:flex;align-items:center;gap:6px;color:#0f172a}
.card .ct svg{color:#0f766e}
.kpi3{display:flex;gap:10px;margin-bottom:10px}
.kpi3>div{flex:1;background:#fff;border:1px solid #eef2f7;border-radius:16px;padding:13px 5px;text-align:center;cursor:pointer;box-shadow:var(--sh)}
.kpi3 .lb{font-size:12.5px;color:#64748b}
.kpi3 .vl{font-size:20px;font-weight:800;margin-top:3px;font-variant-numeric:tabular-nums}
.wide{display:flex;gap:10px;margin-bottom:10px}
.wide>div{flex:1;background:#fff;border:1px solid #eef2f7;border-radius:16px;padding:12px;text-align:center;cursor:pointer;box-shadow:var(--sh)}
.c-green{color:#16a34a}.c-red{color:#dc2626}.c-amber{color:#b45309}.c-brand{color:#0f766e}
.row{display:flex;align-items:center;justify-content:space-between;padding:11px 0;border-bottom:1px solid #f1f5f9;gap:8px}
.refbtn{margin-left:8px;font-size:12px;color:#0f766e;background:#ecfdf5;border:1px solid #99f6e4;border-radius:999px;padding:2px 10px;cursor:pointer;vertical-align:middle;font-family:inherit}
.quickbtn{display:flex;gap:10px;margin:14px 0}
.quickbtn .btn{flex:1;padding:13px}
.kpi3 .invbox{background:linear-gradient(150deg,#115e59,#0f766e 55%,#0d9488);color:#fff;border:none;border-radius:16px;padding:13px 8px;box-shadow:0 4px 12px rgba(15,118,110,.25)}
.kpi3 .invbox .lb,.kpi3 .invbox .vl{color:#fff}
.ctr{margin-left:auto;font-size:12.5px;color:#0f766e;cursor:pointer;padding:12px 6px}
.custbtn{text-align:center;border:1.5px dashed #cbd5e1;border-radius:14px;color:#64748b;padding:14px;margin-top:12px;cursor:pointer;font-size:14px;transition:background .15s}
.custbtn:active{background:#f8fafc}
@media(max-width:520px){.crow{flex-direction:column;align-items:stretch}.crow .cname{width:100%;flex:none!important}.crow .cops{width:100%;flex:none!important;justify-content:flex-start}}
.crow .cops input[type=number]{font-size:16px}
.row:last-child{border-bottom:none}
.row:active{background:#f8fafc;margin:0 -6px;padding-left:6px;padding-right:6px;border-radius:10px}
.row .nm{font-size:14.5px;font-weight:600}
.row .dm{font-size:12.5px;color:#64748b;text-align:right}
.badge{display:inline-block;font-size:11.5px;border-radius:999px;padding:3px 10px;white-space:nowrap;font-weight:600;letter-spacing:.2px}
.b-red{background:#fef2f2;color:#dc2626}
.b-green{background:#ecfdf5;color:#16a34a}
.b-amber{background:#fffbeb;color:#b45309}
.b-gray{background:#f1f5f9;color:#64748b}
.b-brand{background:#ecfdf5;color:#0f766e}
.tbl{width:100%;border-collapse:collapse;table-layout:fixed;font-size:12.5px}
.tbl th{background:#f8fafc;color:#64748b;font-weight:600;text-align:left;padding:8px;border-bottom:1px solid #e2e8f0}
.tbl td{padding:8px;border-bottom:1px solid #f1f5f9;vertical-align:top;word-break:break-all}
.tab{display:flex;gap:8px;margin-bottom:12px}
.tab span{flex:1;text-align:center;font-size:13px;background:#eef2f7;color:#475569;border-radius:999px;padding:8.5px 0;cursor:pointer;transition:all .18s}
.tab span:active{opacity:.8}
.tab span.on{background:linear-gradient(180deg,#0f766e,#0d9488);color:#fff;font-weight:600;box-shadow:0 2px 6px rgba(15,118,110,.28)}
.addbtn{display:inline-block;background:linear-gradient(180deg,#0f766e,#0d9488);color:#fff;border-radius:999px;padding:8px 15px;font-size:13px;font-weight:600;cursor:pointer;box-shadow:0 2px 6px rgba(15,118,110,.25)}
.addbtn:active{opacity:.85}
.plustile{display:flex;align-items:center;justify-content:center;margin:12px 0 0;padding:18px 0;background:#f0fdf4;border:1.5px dashed #0f766e;border-radius:16px;color:#0f766e;font-size:28px;font-weight:700;cursor:pointer;transition:background .15s}
.plustile:active{background:#dcfce7}
.overlay{position:fixed;inset:0;background:rgba(15,23,42,.55);z-index:60;display:flex;align-items:flex-end;justify-content:center;-webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px)}
.overlay .card{width:100%;max-width:560px;border-radius:20px 20px 0 0;padding:16px 16px calc(26px + env(safe-area-inset-bottom));max-height:88vh;overflow:auto;margin-bottom:0}
.uth{display:flex;flex-wrap:wrap;gap:6px}
.uth span{font-size:14px;background:#f1f5f9;color:#475569;border-radius:9px;padding:5px 9px;cursor:pointer;line-height:1.4;transition:all .15s}
.uth span.on{background:#0f766e;color:#fff}
.thumb{width:34px;height:34px;border-radius:9px;object-fit:cover;flex:0 0 auto;background:#f1f5f9}
.grid3>div:last-child:nth-child(3n+1){grid-column:span 3}
.picker{display:flex;gap:8px;align-items:flex-start}
.pcats{width:92px;flex:0 0 auto;background:#fff;border:1px solid #eef2f7;border-radius:14px;padding:7px}
.pcats div{padding:10px 4px;font-size:13px;border-radius:9px;cursor:pointer;margin-bottom:3px;color:#334155;text-align:center;transition:all .15s}
.pcats div.on{background:#0f766e;color:#fff;font-weight:600}
.pcats div:last-child{margin-bottom:0}
.pright{flex:1;min-width:0}
.psubs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:9px}
.usel.usel{width:30px;min-width:30px;padding:4px 1px;text-align:center;border:1px solid #e2e8f0;border-radius:9px;background:#fff;font-size:14px;appearance:none;-webkit-appearance:none;cursor:pointer}
.psub{font-size:12.5px;background:#f1f5f9;color:#475569;border-radius:999px;padding:6px 12px;cursor:pointer;transition:all .15s}
.psub.on{background:#0f766e;color:#fff}
.field{margin-bottom:12px}
.field label{display:block;font-size:12.5px;color:#475569;margin-bottom:5px;font-weight:600}
.field input,.field select,.field textarea{width:100%;border:1px solid #e2e8f0;border-radius:12px;padding:12px;font-size:16px;background:#fff;color:#0f172a;font-family:inherit;transition:border-color .15s,box-shadow .15s}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:#0f766e;box-shadow:0 0 0 3px rgba(15,118,110,.13);caret-color:#0f766e}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tile{background:#fff;border:1px solid #eef2f7;border-radius:16px;padding:12px 3px;text-align:center;font-size:13px;font-weight:500;position:relative;cursor:pointer;box-shadow:0 1px 2px rgba(15,23,42,.04);transition:transform .08s,box-shadow .15s}
.tile:active{background:#f8fafc;transform:scale(.97)}
.tile .ico{margin:0 auto 8px;font-size:20px;display:flex;align-items:center;justify-content:center;width:46px;height:46px;border-radius:14px;background:#ecfdf5;color:#0f766e}
.tile.tc2 .ico{background:#eff6ff;color:#2563eb}
.tile.tc3 .ico{background:#fff1f2;color:#e11d48}
.tile.tc4 .ico{background:#ecfdf5;color:#16a34a}
.tile.tc5 .ico{background:#fffbeb;color:#b45309}
.tile.tc6 .ico{background:#ecfeff;color:#0891b2}
.tile.tc7 .ico{background:#f1f5f9;color:#334155}
.tile.tc8 .ico{background:#f0fdf4;color:#15803d}
.tile.tc9 .ico{background:#f0f9ff;color:#0369a1}
.tile.tc10 .ico{background:#fefce8;color:#a16207}
.tile.tc11 .ico{background:#fef2f2;color:#dc2626}
.tile.tc12 .ico{background:#ecfdf5;color:#059669}
.tile.tc13 .ico{background:#f1f5f9;color:#64748b}
.tile.ed{box-shadow:0 0 0 1.5px #0f766e}
.tile .edb{position:absolute;top:-7px;right:-7px;display:flex;gap:2px}
.tile .edb button{width:22px;height:22px;border-radius:50%;border:none;background:#0f766e;color:#fff;font-size:11px;cursor:pointer;line-height:1}
.tile .edx{position:absolute;top:-7px;left:-7px;width:22px;height:22px;border-radius:50%;border:none;background:#dc2626;color:#fff;font-size:11px;cursor:pointer;line-height:1}
.tile.hid{opacity:.4;border-style:dashed}
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:560px;background:#fff;border-top:1px solid #eef2f7;display:flex;padding:7px 8px calc(9px + env(safe-area-inset-bottom));z-index:20;box-shadow:0 -2px 14px rgba(15,23,42,.06)}
.nav div{flex:1;text-align:center;font-size:11.5px;color:#64748b;padding:6px 0;cursor:pointer;border-radius:12px;margin:0 2px;transition:all .15s}
.nav div:active{background:#f1f5f9}
.nav div.on{color:#0f766e;font-weight:700;background:#ecfdf5;box-shadow:inset 0 0 0 1px rgba(15,118,110,.08)}
.nav svg{display:block;margin:0 auto 3px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:100px;background:#0f172a;color:#fff;padding:11px 18px;border-radius:14px;font-size:13.5px;opacity:0;transition:opacity .25s;z-index:30;max-width:88%;text-align:center;pointer-events:none;box-shadow:0 4px 18px rgba(15,23,42,.28)}
.toast.show{opacity:1}
.money{font-variant-numeric:tabular-nums}
#printArea{display:none}
@media print{
  body.printing #app{display:none}
  body.printing .nav{display:none}
  body.printing #printArea{display:block}
  #printArea{font-size:12px;padding:20px}
  #printArea table{width:100%;border-collapse:collapse}
  #printArea td,#printArea th{border:1px solid #94a3b8;padding:6px;font-size:12px}
  #printArea.ticket{width:58mm;margin:0 auto;padding:8mm 4mm}
  #printArea.ticket table{width:100%;border-collapse:collapse}
  #printArea.ticket td{padding:3px 0;font-size:11px;border-bottom:1px dashed #cbd5e1}
  #printArea.ticket td:last-child{text-align:right}
  #printArea.labels{display:block!important}
  #printArea.labels .lbl{display:inline-block;width:38mm;border:1px dashed #64748b;padding:4px 6px;margin:2mm;vertical-align:top;font-size:11px}
}
.monthsel{display:flex;gap:8px;align-items:center;background:#f1f5f9;border-radius:14px;padding:7px 9px;margin-bottom:10px}
.monthsel .mt{font-size:13px;font-weight:700;flex:1;text-align:center}
.monthsel select{flex:1;border:none;background:#fff;border-radius:10px;padding:9px;font-size:14px;color:#0f172a}
.mk{display:flex;gap:10px;margin-bottom:10px}
.mk>div{flex:1;background:#fff;border:1px solid #eef2f7;border-radius:16px;padding:12px;text-align:center;box-shadow:var(--sh)}
.mk .lb{font-size:11.5px;color:#64748b}
.mk .vl{font-size:16px;font-weight:700;margin-top:3px;font-variant-numeric:tabular-nums}
.bar{background:#f1f5f9;border-radius:6px;height:16px;margin-top:4px;overflow:hidden}
.bar i{display:block;height:16px;border-radius:6px;background:linear-gradient(90deg,#0f766e,#0d9488)}
.barl{display:flex;justify-content:space-between;font-size:12.5px;margin-top:2px}
.note{font-size:12px;color:#64748b;margin-top:6px;line-height:1.6}
.empty{text-align:center;color:#94a3b8;padding:34px 16px;font-size:13.5px;line-height:1.7}
.empty::before{content:'';display:block;width:38px;height:38px;margin:0 auto 12px;border:1.5px dashed #cbd5e1;border-radius:12px;background:#f8fafc}
.menu{background:#fff;border:1px solid #eef2f7;border-radius:16px;overflow:hidden;margin-bottom:10px;box-shadow:var(--sh)}
.menu .mi{display:flex;align-items:center;gap:10px;padding:15px 14px;border-bottom:1px solid #f1f5f9;cursor:pointer;transition:background .12s}
.menu .mi:active{background:#f8fafc}
.menu .mi:last-child{border-bottom:none}
.menu .mi .t{font-size:14.5px;flex:1;font-weight:500}
.menu .mi .d{font-size:12px;color:#64748b}
.radio{display:flex;gap:8px}
.radio label{flex:1;border:1px solid #e2e8f0;border-radius:12px;padding:11px 6px;text-align:center;font-size:13.5px;cursor:pointer;background:#fff;transition:all .18s}
.radio input{display:none}
.radio label.on{border-color:#0f766e;background:#ecfdf5;color:#0f766e;font-weight:600;box-shadow:inset 0 0 0 1px #0f766e}
.chk{display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid #f1f5f9}
.chk:last-child{border-bottom:none}
.chk input{width:19px;height:19px;accent-color:#0f766e}
.chk .dm{font-size:11.5px;color:#64748b}
.chip{display:inline-flex;align-items:center;gap:4px;background:#f1f5f9;border:1px solid #e2e8f0;border-radius:999px;padding:5px 11px;margin:0 6px 6px 0;font-size:13px}
.chip b{color:#dc2626;cursor:pointer;font-weight:700;padding:0 3px}
:focus-visible{outline:2px solid #0f766e;outline-offset:2px}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<nav class="nav" id="nav"></nav>
<div class="toast" id="toast"></div>
<div id="printArea"></div>
<div id="pickOverlay" style="display:none"></div>
<script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<script>
'use strict';
/* ================= 语言字典 ================= */
var T={
  zh:{app:'进销存',home:'首页',sales:'销售',buy:'进货',stock:'库存',more:'更多',today:'今日销售额',gross:'今日销售毛利',orders:'今日销售笔数',inv:'库存总量',custDebt:'客户欠款',supDebt:'供应商欠款',add:'添加',save:'保存',back:'返回',search:'搜索',paid:'已收款',unpaid:'未收款',partial:'部分收款',qk:'常用功能',edit:'编辑',fin:'财务',ana:'分析',set:'设置',remind:'待办提醒',print:'打印',receive:'收款'},
  en:{app:'JXC',home:'Home',sales:'Sales',buy:'Purchase',stock:'Stock',more:'More',today:'Today Sales',gross:'Gross Profit',orders:'Orders',inv:'Stock Value',custDebt:'Receivables',supDebt:'Payables',add:'Add',save:'Save',back:'Back',search:'Search',paid:'Paid',unpaid:'Unpaid',partial:'Partial',qk:'Common',edit:'Edit',fin:'Finance',ana:'Analysis',set:'Settings',remind:'Reminders',print:'Print',receive:'Receive'}
};
function tr(k){var d=T[S.settings.lang]||T.zh;return d[k]||T.zh[k]||k}
/* ================= 工具 ================= */
function fmtD(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function today(){return fmtD(new Date())}
function nowDt(){var d=new Date(),p=function(n){return String(n).padStart(2,'0')};return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+'T'+p(d.getHours())+':'+p(d.getMinutes())}
function addDays(s,n){var d=new Date(s+'T00:00:00');d.setDate(d.getDate()+n);return fmtD(d)}
function daysBetween(a,b){var d1=new Date(a+'T00:00:00'),d2=new Date(b+'T00:00:00');return Math.round((d2-d1)/86400000)}
function money(n){var v=Math.round((n||0)*100)/100;return S.settings.currency+v.toLocaleString('en-US',{maximumFractionDigits:2})}
function r2(n){return Math.round(n*100)/100}
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function punit(p){p=p||{};return p.unit||(p.units&&p.units.length?p.units[0].name:'件')}
function custName(id){var c=S.customers.find(function(x){return x.id===id});return c?c.name:'客户#'+id}
function supName(id){var c=S.suppliers.find(function(x){return x.id===id});return c?c.name:'供应商#'+id}
function prodName(pid){var p=S.products.find(function(x){return x.id===pid});return p?p.name:'商品#'+pid}
function toast(msg){var t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(t._h);t._h=setTimeout(function(){t.classList.remove('show')},1900)}
/* ================= 状态 ================= */
var LS='jxc_trial_v1';
var S=null;
function save(){localStorage.setItem(LS,JSON.stringify(S))}
function load(){try{var r=localStorage.getItem(LS);return r?JSON.parse(r):null}catch(e){return null}}
function seed(){
  var T0=today(),m1=addDays(T0,-3),m2=addDays(T0,-40),m3=addDays(T0,-75);
  var noS=function(k,d,id){return (k==='sale'?'XS':'JH')+d.replace(/-/g,'')+String(id).padStart(3,'0')};
  var o=[
   {kind:'sale',date:T0,party:1,items:[{pid:1,qty:10,price:450,cost:380}],total:4500,paid:4500,account:'现金'},
   {kind:'sale',date:T0,party:3,items:[{pid:3,qty:5,price:70,cost:55},{pid:7,qty:8,price:48,cost:38}],total:734,paid:0,account:''},
   {kind:'sale',date:m1,party:1,items:[{pid:1,qty:20,price:445,cost:380},{pid:5,qty:10,price:120,cost:95}],total:10100,paid:3000,account:'现金'},
   {kind:'sale',date:m1,party:2,items:[{pid:5,qty:10,price:120,cost:95},{pid:2,qty:40,price:78,cost:62}],total:4320,paid:4320,account:'现金'},
   {kind:'sale',date:m2,party:1,items:[{pid:1,qty:20,price:450,cost:380}],total:9000,paid:4000,account:'银行'},
   {kind:'sale',date:m3,party:3,items:[{pid:2,qty:30,price:78,cost:62},{pid:4,qty:60,price:25,cost:18}],total:3840,paid:0,account:''},
   {kind:'sale',date:m2,party:2,items:[{pid:7,qty:20,price:48,cost:38}],total:960,paid:960,account:'现金'},

function custOut(cid){var s=0;S.orders.forEach(function(o){if(o.kind==='sale'&&o.party===cid)s+=o.total-o.paid});S.returns.forEach(function(r){if(r.kind==='saleReturn'&&r.party===cid)s-=r.total});return Math.max(0,r2(s))}
function custRecv(cid){var s=0;S.payments.forEach(function(p){if(p.dir==='in'&&p.party===cid)s+=p.amount+p.discount});return r2(s)}
function suppOut(sid){var s=0;S.orders.forEach(function(o){if(o.kind==='purchase'&&o.party===sid)s+=o.total-o.paid});S.returns.forEach(function(r){if(r.kind==='purchaseReturn'&&r.party===sid)s-=r.total});return Math.max(0,r2(s))}
function orderStatus(o){if(o.paid>=o.total-0.005)return'paid';if(o.paid<=0.005)return'unpaid';return'partial'}
function uFactor(p,n){var u=p.units&&p.units.length?p.units:[{name:p.unit||'件',factor:1}];for(var i=0;i<u.length;i++){if(u[i].name===n)return u[i].factor}return 1}
function totalStock(p){p=p||{};var f=(p.units&&p.units[1])?p.units[1].factor:1;return r2((p.stock||0)+((p.parts||0)/f))}
function stockView(p){p=p||{};var u=p.units&&p.units.length?p.units:[{name:p.unit||'件',factor:1}];if(u.length>1&&(p.parts||0)>0)return p.stock+' '+esc(u[0].name)+'+'+(p.parts||0)+' '+esc(u[1].name);return p.stock+' '+esc(u[0].name)}
function addStock(p,un,cnt){if(!p)return;cnt=parseFloat(cnt)||0;var f=uFactor(p,un);if(f<=1){p.stock=r2((p.stock||0)+cnt)}else{var pr=(p.parts||0)+cnt;var add=Math.floor(pr/f);p.stock=(p.stock||0)+add;p.parts=r2(pr-add*f)}}
function subStock(p,un,cnt){if(!p)return false;cnt=parseFloat(cnt)||0;var f=uFactor(p,un);var tot=(p.stock||0)*f+(p.parts||0);if(tot<cnt-0.001)return false;if(f<=1){p.stock=r2((p.stock||0)-cnt);return true}var pr=(p.parts||0)-cnt;if(pr>=0){p.parts=r2(pr)}else{var need=Math.ceil(-pr/f);p.stock=(p.stock||0)-need;p.parts=r2(pr+need*f)}return true}
function pMinF(p){p=p||{};var u=p.units&&p.units.length?p.units:[{name:p.unit||'件',factor:1}];var m=1;u.forEach(function(x){if(x.factor>m)m=x.factor});return m}
function pMinQty(p){p=p||{};return r2((p.stock||0)*pMinF(p)+(p.parts||0))}
function pMinCost(p){p=p||{};return (p.minCost==null?r2((p.buy||0)/pMinF(p)):p.minCost)}
function mainCost(p){p=p||{};return r2(pMinCost(p)*pMinF(p))}
function stockTotals(){var n=0,b=0,s=0;S.products.forEach(function(p){var t=totalStock(p);n+=t;b+=pMinQty(p)*pMinCost(p);s+=t*(p.price_retail||0)});return{n:Math.round(n),b:r2(b),s:r2(s)}}
function reminders(){
  var out=[],T0=today();
  S.customers.forEach(function(c){
    if(!c.reminder||!c.reminder.enabled)return;
    if(c.reminder.mode==='perBill'){
      S.orders.forEach(function(o){if(o.kind!=='sale'||o.party!==c.id)return;var rem=o.total-o.paid;if(rem<=0)return;var due=addDays(o.date,c.reminder.overdueDays);var od=daysBetween(due,T0);if(od>0)out.push({txt:c.name+' 单'+o.no.slice(-5)+' 逾期'+od+'天 欠'+money(rem),c:c.id})});
    }else{
      var oo=custOut(c.id);if(oo>c.reminder.amount)out.push({txt:c.name+' 欠款总额'+money(oo)+' 超过提醒额度'+money(c.reminder.amount),c:c.id});
    }
  });
  return out;
}

function addUser(){
  var u=document.getElementById('nu_user').value.trim(),n=document.getElementById('nu_name').value.trim()||u,p=document.getElementById('nu_pass').value||'123456';
  if(!u){toast('请填写用户名');return}
  if(S.users.some(function(x){return x.user===u})){toast('用户名已存在');return}
  var perms={};document.querySelectorAll('#set_user_fold input[type=checkbox]:checked').forEach(function(c){perms[c.value]=1});
  S.users.push({id:S.nextId++,user:u,pass:phash(p),role:'staff',perms:perms,name:n});save();toast('已添加员工');render();
}
function chgPwd(i){var v=document.getElementById('pw_'+i).value;if(!v){toast('请输入新密码');return}S.users[i].pass=phash(v);save();toast('密码已重置');render()}
function delUser(i){var u=S.users[i];if(!u||u.role==='owner'){toast('主账号不可删除');return}if(!confirm('删除员工 '+u.name+'？'))return;S.users.splice(i,1);var cu=curUser();if(cu&&cu.user===u.user)sessionStorage.removeItem('jxc_user');save();render()}

function setNav(){
  var map={home:'home',fin:'fin',ana:'ana',more:'more'};

  else if(cur.indexOf('v-analysis')===0)map[cur]='ana';
  else map[cur]='more';
  var navs=[['home',tr('home'),'v-home'],['fin',tr('fin'),'v-finance'],['ana',tr('ana'),'v-analysis'],['more','我的','v-more']];
  document.getElementById('nav').innerHTML=navs.map(function(x){return'<div class="'+(map[cur]===x[0]?'on':'')+'" onclick="go(\''+x[2]+'\')">'+ic(x[0])+x[1]+'</div>'}).join('');

function totalCustOut(){var s=0;S.customers.forEach(function(c){s+=custOut(c.id)});return r2(s)}
function totalSuppOut(){var s=0;S.suppliers.forEach(function(x){s+=suppOut(x.id)});return r2(s)}
function gridMove(idx,dir){var g=S.homeGrid;var j=idx+dir;if(j<0||j>=g.order.length)return;var t=g.order[idx];g.order[idx]=g.order[j];g.order[j]=t;save();render()}
function gridHide(idx){var g=S.homeGrid,id=g.order[idx];var h=g.hidden.indexOf(id);if(h>=0){g.hidden.splice(h,1)}else{g.hidden.push(id)}save();render()}

var salesTab='all',CART=[],cartMode='unpaid';
function cartReset(){CART=[];cartMode='unpaid'}
function openSaleForm(oid){cartReset();saleFormLoaded=false;go('v-sale-form',oid||null)}
function goPick(){pickMain='all';pickSub='all';searchQ='';go('v-pick-product')}
function openPurchaseForm(){cartReset();go('v-purchase-form')}
function openSaleReturn(cid){cartReset();go('v-sale-return',cid||null)}
function cartAdd(pid){var p=S.products.find(function(x){return x.id===pid});if(!p)return;var u0=p.units&&p.units.length?p.units[0]:{name:p.unit||'件',factor:1};var it=CART.find(function(x){return x.pid===pid&&x.unitSel===u0.name});if(it){it.qty++;}else{CART.push({pid:p.id,name:p.name,unit:p.unit,unitSel:u0.name,factor:u0.factor,qty:1,price:basePrice(p),discount:100,note:'',cost:mainCost(p),commission:p.commission||0})}refreshCart()}
function cartQty(idx,v){var it=CART[idx];if(!it)return;it.qty=Math.max(0.001,parseFloat(v)||0)/it.factor;refreshCart()}
function cartPrice(idx,v){var it=CART[idx];if(!it)return;it.price=Math.max(0,parseFloat(v)||0)*it.factor;refreshCart()}
function cartDisc(idx,v){var it=CART[idx];if(!it)return;it.discount=Math.max(0,Math.min(100,parseFloat(v)||0));refreshCart()}
function cartDel(idx){CART.splice(idx,1);refreshCart()}
function cartTotal(){return r2(CART.reduce(function(s,it){return s+it.qty*it.price*(it.discount==null?100:it.discount)/100},0))}
function cartRowsHtml(){
  if(!CART.length)return'<div class="empty">尚未添加商品</div>';
  return CART.map(function(it,i){var up=Math.round(it.price/it.factor*100)/100,amt=r2(it.qty*it.price*it.discount/100);
    return'<div class="row crow"><div class="cname" style="flex:3;min-width:0"><div class="nm">'+esc(it.name)+(it.note?'<span style="font-size:11px;color:#94a3b8"> · '+esc(it.note)+'</span>':'')+'</div><div class="dm">'+esc(it.unitSel)+(it.discount<100?' · '+it.discount+'%':'')+' · 进价 '+money(it.cost)+'/'+esc(it.unit)+'</div></div><div class="cops" style="flex:2.4;display:flex;gap:5px;align-items:center;flex-wrap:wrap"><input type="number" min="0.001" step="any" value="'+r2(it.qty*it.factor)+'" onchange="cartQty('+i+',this.value)" style="width:48px;border:1px solid #e2e8f0;border-radius:8px;padding:6px;text-align:center"><input type="number" min="0" step="0.01" value="'+up+'" onchange="cartPrice('+i+',this.value)" style="width:64px;border:1px solid #e2e8f0;border-radius:8px;padding:6px;text-align:center"><input type="number" min="0" max="100" step="0.1" value="'+it.discount+'" onchange="cartDisc('+i+',this.value)" style="width:48px;border:1px solid #e2e8f0;border-radius:8px;padding:6px;text-align:center"><span class="money" style="font-weight:700;width:58px;text-align:right">'+money(amt)+'</span><button class="btn red sm" onclick="cartDel('+i+')">×</button></div></div>'}).join('');
}
function refreshCart(){
  var box=document.getElementById('cartBox');if(!box)return;
  box.innerHTML=cartRowsHtml();
  var ct0=document.getElementById('cartTotal');if(ct0)ct0.textContent=money(cartTotal());
  var pb=document.getElementById('pickBar');if(pb)pb.innerHTML='已选 '+CART.length+' 件 · 合计 '+money(cartTotal());
}

  if(pid){var p=S.products.find(function(x){return x.id===pid});Object.keys(d).forEach(function(k){p[k]=d[k]})}else{S.products.push({id:S.nextId++,...d})}

}

var bmMain='all',bmTab='comm';
function setBmMain(m){bmMain=m;render()}
function setBmTab(t){bmTab=t;render()}
function bmList(){return S.products.filter(function(p){return bmMain==='all'||p.cat===bmMain})}
function bmApply(){
  var L=bmList();if(!L.length){toast('该分类暂无商品');return}
  if(bmTab==='comm'){
    var v=parseFloat(document.getElementById('bm_comm').value);if(!(v>=0)){toast('请输入提成金额');return}
    if(!confirm('将 '+L.length+' 个商品提成设为 '+money(v)+'（每主单位）？'))return;
    L.forEach(function(p){p.commission=v});
  }else if(bmTab==='price'){
    var r=document.getElementById('bm_retail').value.trim(),b=document.getElementById('bm_batch').value.trim(),c=document.getElementById('bm_buy').value.trim();
    if(r===''&&b===''&&c===''){toast('请至少填写一个价格');return}
    var rv=r===''?null:parseFloat(r),bv=b===''?null:parseFloat(b),cv=c===''?null:parseFloat(c);
    if(!confirm('将 '+L.length+' 个商品批量改价：'+(rv!=null?'零售 ¥'+rv+' ':'')+(bv!=null?'批发 ¥'+bv+' ':'')+(cv!=null?'进价 ¥'+cv:'')+'？'))return;
    L.forEach(function(p){if(rv!=null)p.price_retail=rv;if(bv!=null)p.price_batch=bv;if(cv!=null)p.buy=cv});
  }
  save();toast('已批量修改 '+L.length+' 个商品');go('v-products');
}
function bmDis(v){var L=bmList();if(!L.length){toast('该分类暂无商品');return}if(!confirm('将 '+L.length+' 个商品'+(v?'禁用（销售选择页面不再显示）':'启用（恢复销售）')+'？'))return;L.forEach(function(p){p.disabled=v});save();toast('已批量修改 '+L.length+' 个商品');go('v-products')}

function remTag(c,small){var r=c.reminder||{};if(r.enabled){return r.mode==='perBill'?'<span class="badge b-amber" onclick="event.stopPropagation();go(\'v-reminder\','+c.id+')">提醒·每单 '+r.overdueDays+'天</span>':'<span class="badge b-brand" onclick="event.stopPropagation();go(\'v-reminder\','+c.id+')">提醒·月总超'+money(r.amount||0)+'</span>'}return'<span class="badge b-gray" onclick="event.stopPropagation();go(\'v-reminder\','+c.id+')">提醒·未设置</span>'}
function overdueOf(c){var T0=today(),mx=0;var dd=c.reminder&&c.reminder.enabled?c.reminder.overdueDays:30;S.orders.forEach(function(o){if(o.kind!=='sale'||o.party!==c.id||o.total-o.paid<=0)return;var od=daysBetween(addDays(o.date,dd),T0);if(od>mx)mx=od});return mx}

var custMonth='全部',custBillTab='all';
function custMonths(cid){var m={};S.orders.forEach(function(o){if(o.kind==='sale'&&o.party===cid)m[o.date.slice(0,7)]=1});S.payments.forEach(function(p){if(p.dir==='in'&&p.party===cid)m[p.date.slice(0,7)]=1});S.returns.forEach(function(r){if(r.kind==='saleReturn'&&r.party===cid)m[r.date.slice(0,7)]=1});return Object.keys(m).sort().reverse()}
VIEWS['v-cust-detail']=function(cid){
  var c=S.customers.find(function(x){return x.id===cid});if(!c)return'';
  var out=custOut(c.id),recv=custRecv(c.id);
  var months=custMonths(cid);
  var entries=[];
  S.orders.forEach(function(o){if(o.kind!=='sale'||o.party!==cid)return;var st=orderStatus(o);entries.push({date:o.no.slice(0,0)+o.date,no:o.no,kind:st==='paid'?'opaid':'ounpaid',id:o.id,label:'销售单',amt:st==='paid'?o.paid:(o.total-o.paid)})});
  S.payments.forEach(function(p){if(p.dir==='in'&&p.party===cid)entries.push({date:p.date,no:p.no,kind:'pay',id:0,label:'收款单',amt:p.amount+p.discount})});
  S.returns.forEach(function(r){if(r.kind==='saleReturn'&&r.party===cid)entries.push({date:r.date,no:r.no,kind:'ret',id:0,label:'退货单',amt:r.total})});
  if(custMonth!=='全部')entries=entries.filter(function(e){return e.date.slice(0,7)===custMonth});
  if(custBillTab==='unpaid')entries=entries.filter(function(e){return e.kind==='ounpaid'});
  if(custBillTab==='paid')entries=entries.filter(function(e){return e.kind!=='ounpaid'});
  entries.sort(function(a,b){return a.date<b.date?1:-1});
  var rows=entries.map(function(e){
    if(e.kind==='ounpaid')return'<div class="row" onclick="go(\'v-order-detail\','+e.id+')"><div><div class="nm">'+e.label+' '+e.no.slice(-5)+'</div><div class="dm">'+e.date+'</div></div><div class="dm"><span class="badge b-red">未收</span><div class="money c-red" style="font-weight:700">'+money(e.amt)+'</div></div></div>';
    if(e.kind==='opaid')return'<div class="row" onclick="go(\'v-order-detail\','+e.id+')"><div><div class="nm">'+e.label+' '+e.no.slice(-5)+'</div><div class="dm">'+e.date+'</div></div><div class="dm"><span class="badge b-green">已收</span><div class="money c-green" style="font-weight:700">'+money(e.amt)+'</div></div></div>';
    if(e.kind==='pay')return'<div class="row" onclick="toast(\'收款记录\')"><div><div class="nm">'+e.label+' '+e.no.slice(-5)+'</div><div class="dm">'+e.date+'</div></div><div class="dm"><span class="badge b-green">收回</span><div class="money c-green" style="font-weight:700">'+money(e.amt)+'</div></div></div>';
    return'<div class="row" onclick="toast(\'退货已冲减欠款\')"><div><div class="nm">'+e.label+' '+e.no.slice(-5)+'</div><div class="dm">'+e.date+'</div></div><div class="dm"><span class="badge b-brand">退货</span><div class="money c-brand" style="font-weight:700">-'+money(e.amt)+'</div></div></div>';
  }).join('');
  var mOpts=['<option value="全部"'+(custMonth==='全部'?' selected':'')+'>全部单据</option>'].concat(months.map(function(m){return'<option value="'+m+'"'+(custMonth===m?' selected':'')+'>'+m+'</option>'})).join('');
  return '<div class="topbar"><span class="back" onclick="go(\'v-debt\')">‹</span><div class="tt">'+esc(c.name)+'</div><div class="sub"><span style="color:#0f766e;cursor:pointer" onclick="go(\'v-payment-form\',{dir:\'in\',party:'+cid+',back:[\'v-cust-detail\','+cid+']})">收款</span></div></div>'+
   '<div class="mk"><div><div class="lb c-red">应收欠款</div><div class="vl c-red money">'+money(out)+'</div></div><div><div class="lb c-green">已收回</div><div class="vl c-green money">'+money(recv)+'</div></div></div>'+
   '<div class="monthsel"><select onchange="custMonth=this.value;render()">'+mOpts+'</select><span style="font-size:11px;color:#64748b;white-space:nowrap">默认全部，点此按月查询</span></div>'+
   '<div class="tab"><span class="'+(custBillTab==='all'?'on':'')+'" onclick="custBillTab=\'all\';render()">全部</span><span class="'+(custBillTab==='unpaid'?'on':'')+'" onclick="custBillTab=\'unpaid\';render()">未收</span><span class="'+(custBillTab==='paid'?'on':'')+'" onclick="custBillTab=\'paid\';render()">已收</span></div>'+
   '<div class="card">'+(rows||'<div class="empty">该月无单据</div>')+'</div>'+
   '<div class="btnrow"><button class="btn gray" onclick="remindCopy('+cid+')">一键催款</button><button class="btn gray" onclick="billCopy('+cid+')">对账单</button></div>'+
   '<div class="btnrow"><button class="btn ghost sm" style="flex:none;width:auto" onclick="go(\'v-reminder\','+cid+')">'+ic('bell')+' 欠款提醒设置</button></div>';

function billCopy(cid){var c=S.customers.find(function(x){return x.id===cid});var lines=['—— '+S.settings.shop+' 对账单 ——','客户：'+c.name,''];
  S.orders.forEach(function(o){if(o.kind==='sale'&&o.party===cid)lines.push(o.date+' '+o.no.slice(-5)+' 金额'+money(o.total)+' 已收'+money(o.paid))});
  S.payments.forEach(function(p){if(p.dir==='in'&&p.party===cid)lines.push(p.date+' 收款'+money(p.amount+p.discount))});

function savePayment(dir){
  var party=parseInt(document.getElementById('pay_party').value,10),acc=document.getElementById('pay_acc').value;
  var amt=parseFloat(document.getElementById('pay_amt').value)||0,disc=parseFloat(document.getElementById('pay_disc').value)||0,alloc=r2(amt+disc);
  if(alloc<=0){toast('请输入实收金额');return}
  var list=(dir==='in'?S.orders.filter(function(o){return o.kind==='sale'&&o.party===party&&o.total-o.paid>0}):S.orders.filter(function(o){return o.kind==='purchase'&&o.party===party&&o.total-o.paid>0})).sort(function(a,b){return a.date<b.date?1:-1});
  var targets=[],remain=alloc;
  list.forEach(function(o){if(remain<=0)return;var take=0;if(payMode==='manual'){if(!paySel[o.id])return;take=Math.min(r2(o.total-o.paid),remain)}else{take=Math.min(r2(o.total-o.paid),remain)}if(take>0){o.paid=r2(o.paid+take);targets.push({oid:o.id,amt:take});remain=r2(remain-take)}});
  S.payments.push({id:S.nextId++,no:(dir==='in'?'SK':'FK')+today().replace(/-/g,'')+String(S.nextId).padStart(3,'0'),date:today(),dir:dir,party:party,account:acc,amount:amt,discount:disc,allocate:alloc,targets:targets,mode:payMode});
  save();toast(dir==='in'?'收款成功，欠款已核销':'付款成功');go('v-more');
}

VIEWS['v-analysis']=function(){
  var ms={};S.orders.forEach(function(o){if(o.kind==='sale'){var m=(o.date||'').slice(0,7);if(m)ms[m]=1}});
  var mKeys=Object.keys(ms).sort().reverse();
  var monSel='<div class="field" style="margin:0 0 4px"><label>日期</label><select onchange="setAnaMon(this.value)"><option value="all"'+(anaMon==='all'?' selected':'')+'>全部</option>'+mKeys.map(function(m){return'<option value="'+m+'"'+(anaMon===m?' selected':'')+'>'+m.slice(0,4)+'年'+parseInt(m.slice(5),10)+'月</option>'}).join('')+'</select></div>';
  var ords=S.orders.filter(function(o){return o.kind==='sale'&&(anaMon==='all'||(o.date||'').slice(0,7)===anaMon)});
  var totAmt=r2(ords.reduce(function(s,o){return s+o.total},0));
  var totG=r2(ords.reduce(function(s,o){return s+o.total-(o.items||[]).reduce(function(s2,it){return s2+(it.cost||0)*it.qty},0)},0));
  var pmap={};ords.forEach(function(o){o.items.forEach(function(it){var p=S.products.find(function(x){return x.id===it.pid});var k=it.pid;pmap[k]=pmap[k]||{pid:it.pid,name:it.name||(p?p.name:''),cat:p?p.cat:'未分类',qty:0,amt:0,g:0};pmap[k].qty+=it.qty;pmap[k].amt+=r2(it.qty*it.price);pmap[k].g+=r2((it.price-(it.cost||0))*it.qty)})});
  var plist=Object.keys(pmap).map(function(k){return pmap[k]});
  var rk=['#dc2626','#ea580c','#16a34a'];
  var catHtml='';
  if(anaCat==='all'){
    var catTot={};plist.forEach(function(x){var c=x.cat;catTot[c]=catTot[c]||{cat:c,qty:0,amt:0,g:0,n:0};catTot[c].qty+=x.qty;catTot[c].amt+=x.amt;catTot[c].g+=x.g;catTot[c].n++});
    var cats=Object.keys(catTot).map(function(k){return catTot[k]}).sort(function(a,b){return b.qty-a.qty});
    catHtml='<div class="card"><div class="ct">主分类排行（'+(anaMon==='all'?'全部':anaMon.slice(0,4)+'年'+parseInt(anaMon.slice(5),10)+'月')+'）</div>'+cats.map(function(c,i){return'<div class="row" onclick="setAnaCat(\''+esc(c.cat)+'\')"><div><div class="nm" style="color:'+rk[i]+';font-weight:700">'+esc(c.cat)+'</div><div class="dm">'+c.n+' 个商品 · 销量 '+c.qty+' 件</div></div><div class="dm"><div class="money" style="font-weight:700">'+money(c.amt)+'</div><div class="money c-brand">毛利 '+money(c.g)+'</div></div></div>'}).join('')||'<div class="empty">该月份暂无销售数据</div></div>';
  }else{
    var cp=plist.filter(function(x){return x.cat===anaCat}).sort(function(a,b){return b.qty-a.qty});
    var maxA=cp.length?cp[0].qty:1;var maxG=Math.max.apply(null,cp.map(function(x){return x.g||0}));if(!(maxG>0))maxG=1;
    var ah=cp.map(function(x,i){return'<div class="barl"><span style="color:'+rk[i]+';font-weight:700">'+esc(x.name)+'</span><span class="money">销量 '+x.qty+' 件 · '+money(x.amt)+'</span></div><div class="bar"><i style="width:'+Math.round(x.qty/maxA*100)+'%"></i></div>'}).join('')||'<div class="empty">该分类暂无销售</div>';
    var gh=cp.map(function(x,i){return'<div class="barl"><span style="color:'+rk[i]+';font-weight:700">'+esc(x.name)+'</span><span class="money c-brand">'+money(x.g)+'</span></div><div class="bar"><i style="width:'+Math.max(0,Math.round((x.g||0)/maxG*100))+'%;background:#b45309"></i></div>'}).join('')||'<div class="empty">暂无数据</div>';
    catHtml='<div class="card"><div class="ct"><span style="color:#0f766e;cursor:pointer" onclick="setAnaCat(\'all\')">‹ 全部分类</span> · '+esc(anaCat)+'</div><div class="ct">商品销售排行（按销量）</div>'+ah+'</div>'+'<div class="card"><div class="ct">商品毛利排行</div>'+gh+'</div>';
  }
  var low=S.products.filter(function(p){return p.warn&&totalStock(p)<=p.low}),high=S.products.filter(function(p){return p.warn&&totalStock(p)>=p.high});
  var warnHtml=low.map(function(p){return'<div class="row"><div class="nm" style="font-size:13px">'+esc(p.name)+'</div><div class="dm"><span class="badge b-red">低库存 '+stockView(p)+'/'+p.low+'</span></div></div>'}).join('');
  warnHtml+=high.map(function(p){return'<div class="row"><div class="nm" style="font-size:13px">'+esc(p.name)+'</div><div class="dm"><span class="badge b-amber">超上限 '+stockView(p)+'/'+p.high+'</span></div></div>'}).join('');
  return '<div class="topbar"><span class="back" onclick="go(\'v-more\')">‹</span><div class="tt">经营分析</div></div>'+
   '<div class="card">'+monSel+'<div class="row"><span class="nm">总销售</span><span class="money" style="font-weight:700">'+money(totAmt)+'</span></div><div class="row"><span class="nm">总毛利</span><span class="money c-brand">'+money(totG)+'</span></div><div class="row"><span class="nm">销售单数</span><span class="money">'+ords.length+'</span></div></div>'+catHtml+
   '<div class="card"><div class="ct">库存预警'+(low.length+high.length?'<span class="badge b-red">'+(low.length+high.length)+'</span>':'')+'</div>'+(warnHtml||'<div class="empty">库存正常</div>')+'</div>';
};

function clearData(){if(!confirm('确定清空全部数据？此操作不可恢复。'))return;S={settings:{currency:'¥',lang:'zh',shop:'我的小店',accounts:['现金','银行','微信','MoMo']},products:[],customers:[],suppliers:[],orders:[],payments:[],returns:[],stockLogs:[],salesmen:[{id:1,name:'老板',commission:1}],custPrices:{},cats:[],units:['件','箱','瓶','袋','包','桶','盒','kg','斤'],nextId:1,homeGrid:{order:[1,2,7,3,8,6,11,9,13],hidden:[]},users:[{id:1,user:'admin',pass:phash('123456'),role:'owner',perms:{},name:'老板'}]};save();go('v-home');toast('数据已清空')}
/* ================= 视图：业务员 ================= */
function smStats(){
  var map={};S.salesmen.forEach(function(sm){map[sm.name]={name:sm.name,orders:0,qty:0,sales:0,cost:0,comm:0}});
  S.orders.forEach(function(o){if(o.kind!=='sale')return;var k=o.salesman||'老板';if(!map[k])map[k]={name:k,orders:0,qty:0,sales:0,cost:0,comm:0};var st=map[k];st.orders++;o.items.forEach(function(it){var cm=(it.commission!=null)?it.commission:((S.products.find(function(x){return x.id===it.pid})||{}).commission||0);st.qty+=it.qty;st.cost+=(it.cost||0)*it.qty;st.comm+=r2(it.qty*cm)});st.sales+=o.total});
  var list=Object.keys(map).map(function(k){return map[k]});
  list.forEach(function(x){x.profit=r2(x.sales-x.cost)});
  return list;
}
VIEWS['v-salesmen']=function(){
  var list=smStats();
  var rows=list.map(function(x){return'<div class="row" onclick="go(\'v-salesman-detail\',\''+x.name+'\')"><div><div class="nm">'+esc(x.name)+'</div><div class="dm">'+x.orders+'单 · 销量'+x.qty+'</div></div><div class="dm"><div class="money c-brand" style="font-weight:700">销售 '+money(x.sales)+'</div><div style="font-size:11px">提成 '+money(x.comm)+'</div></div></div>'}).join('');
  return '<div class="topbar"><div class="tt">业务员</div><div class="sub"><span class="addbtn" onclick="go(\'v-salesman-form\')">+ 添加业务员</span></div></div>'+
   '<div class="card">'+(rows||'<div class="empty">暂无业务员</div>')+'</div>'+
   '<div class="note" style="text-align:center">提成 = 各商品提成金额 × 销量 自动汇总；提成金额在商品里设置</div>';
};
VIEWS['v-salesman-form']=function(){
  return '<div class="topbar"><span class="back" onclick="go(\'v-salesmen\')">‹</span><div class="tt">添加业务员</div></div>'+
   '<div class="card"><div class="field"><label>姓名</label><input id="sm_name"></div></div>'+
   '<button class="btn" onclick="saveSalesman()">保存</button>';
};
function saveSalesman(){var n=document.getElementById('sm_name').value.trim();if(!n){toast('请填写姓名');return}if(S.salesmen.some(function(x){return x.name===n})){toast('该业务员已存在');return}S.salesmen.push({id:S.nextId++,name:n,commission:0});save();toast('已保存');go('v-salesmen')}
VIEWS['v-salesman-detail']=function(nm){
  var list=S.orders.filter(function(o){return o.kind==='sale'&&(o.salesman||'老板')===nm});
  var rows=list.sort(function(a,b){return a.date<b.date?1:-1}).map(function(o){var st=orderStatus(o),b=st==='paid'?'b-green':st==='unpaid'?'b-red':'b-amber',lb=st==='paid'?tr('paid'):st==='unpaid'?tr('unpaid'):tr('partial');return'<div class="row" onclick="go(\'v-order-detail\','+o.id+')"><div><div class="nm">'+esc(custName(o.party))+'</div><div class="dm">'+o.no+' · '+(o.datetime||o.date).replace('T',' ')+'</div></div><div class="dm"><span class="badge '+b+'">'+lb+'</span><div class="money" style="font-weight:700">'+money(o.total)+'</div></div></div>'}).join('');
  return '<div class="topbar"><span class="back" onclick="go(\'v-salesmen\')">‹</span><div class="tt">'+esc(nm)+' 销售明细</div></div>'+
   '<div class="card">'+(rows||'<div class="empty">该业务员暂无销售单据</div>')+'</div>';
};
/* ================= 视图：更多 ================= */
VIEWS['v-more']=function(){
  var items=[['v-products','tag','商品管理','库存与价格、预警下限上限'],['v-customers','user','客户管理','欠款、收款、提醒设置'],['v-suppliers','users','供应商管理','供应商与欠款'],['v-debt','pay','客户欠款','欠款总览与月度查询'],['v-supplier-debt','pay','供应商欠款','应付汇总与付款'],['v-finance','fin','财务','收支流水、应收应付、利润'],['v-analysis','ana','经营分析','销售排行、毛利、库存预警'],['v-settings','set','设置','币种、语言、店铺、数据']];
  var menu=items.map(function(x){return'<div class="mi" onclick="go(\''+x[0]+'\')"><span style="color:#0f766e">'+ic(x[1])+'</span><span class="t">'+x[2]+'</span><span class="d">'+x[3]+'</span><span style="color:#94a3b8">›</span></div>'}).join('');

   '<div class="menu">'+menu+'</div>'+
   '<div class="note" style="text-align:center">进销存试用版 · 数据存本机 · 示例数据可重置</div>';

/* ================= 启动 ================= */
function migrate(s){
  var m={'泰国香米 50kg':'米面','面粉 25kg':'米面','食用油 5L':'油品','白糖 50kg':'糖类','鸡蛋 30枚':'蛋类','可乐 24瓶装':'饮料','洗衣粉 3kg':'洗涤'};
  s.products.forEach(function(p){
    if(!('cat2' in p))p.cat2=m[p.name]||'';if(!p.cat)p.cat='未分类';
    if(!('price_retail' in p)){p.price_retail=p.sell||0;delete p.sell}
    if(!('price_batch' in p))p.price_batch=p.price_retail;
    if(!('disabled' in p))p.disabled=0;
    if(!p.unit)p.unit=(p.units&&p.units.length)?p.units[0].name:'件';
    if(!('units' in p))p.units=[{name:p.unit||'件',factor:1}];
    if(!('code' in p))p.code='';if(!('spec' in p))p.spec='';if(!('img' in p))p.img='';if(!('note' in p))p.note='';if(!('commission' in p))p.commission=0;
    if(!('parts' in p)){var mf=(p.units&&p.units[1])?p.units[1].factor:1;p.parts=Math.round((p.stock-Math.floor(p.stock))*mf);p.stock=Math.floor(p.stock)}
    if(!('minCost' in p))p.minCost=r2((p.buy||0)/pMinF(p));
    if(!('barcode' in p.units[0]))p.units[0].barcode=p.barcode||'';
    p.units.forEach(function(u,i){if(i>0&&!('barcode' in u))u.barcode=''});
  });
  s.orders.forEach(function(o){
    if(!o.salesman)o.salesman='老板';if(!o.saleType)o.saleType='零售';if(!o.datetime)o.datetime=o.date+'T09:00';
    o.items.forEach(function(it){if(!('discount' in it))it.discount=100;if(!('unitSel' in it)){it.unitSel=it.unit||'件';it.factor=1}if(!('note' in it))it.note=''});if(!o.op)o.op='';
  });
  if(!s.salesmen)s.salesmen=[{id:1,name:'老板',commission:1}];
  if(!s.users||!s.users.length)s.users=[{id:1,user:'admin',pass:phash('123456'),role:'owner',perms:{},name:'老板'}];
  if(!s.custPrices)s.custPrices={};
  if(!s.units||!s.units.length)s.units=['件','箱','瓶','袋','包','桶','盒','kg','斤'];
  if(!s.cats||!s.cats.length){var cm={},cf={};s.products.forEach(function(p){if(p.cat){cm[p.cat]=1;if(p.cat2)cf[p.cat+'|'+p.cat2]=1}});s.cats=Object.keys(cm).map(function(c,i){return{id:i+1,name:c,subs:Object.keys(cf).filter(function(k){return k.indexOf(c+'|')===0}).map(function(k){return k.split('|')[1]})}})}
  var HORDER=[1,2,7,3,8,6,11,9,13];if(!s.homeGrid)s.homeGrid={order:HORDER.slice(),hidden:[]};else if(s.homeGrid.order.some(function(id){return id===4||id===5||id===10||id===12})||s.homeGrid.order.length>9||s.homeGrid.order.indexOf(13)<0){s.homeGrid.order=HORDER.slice();s.homeGrid.hidden=[]}
}
function boot(){S=load();if(S){migrate(S)}else{S=seed()}save();render()}
boot();
</script>
